app-id: org.dupot.beatmatchtopass
base: org.godotengine.godot.BaseApp
base-version: '4.7'
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: beatmatchtopass
finish-args:
  - --share=ipc
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: beatmatchtopass
    buildsystem: simple

    build-commands:
      - install -Dm755 beatmatchtopass.sh /app/bin/beatmatchtopass
      - install -Dm644 gameArchive/beatmatchtopass.pck /app/bin/beatmatchtopass.pck
      - install -Dm644 gameArchive/icons/16x16.png $FLATPAK_DEST/share/icons/hicolor/16x16/apps/org.dupot.beatmatchtopass.png
      - install -Dm644 gameArchive/icons/24x24.png $FLATPAK_DEST/share/icons/hicolor/24x24/apps/org.dupot.beatmatchtopass.png
      - install -Dm644 gameArchive/icons/32x32.png $FLATPAK_DEST/share/icons/hicolor/32x32/apps/org.dupot.beatmatchtopass.png
      - install -Dm644 gameArchive/icons/48x48.png $FLATPAK_DEST/share/icons/hicolor/48x48/apps/org.dupot.beatmatchtopass.png
      - install -Dm644 gameArchive/icons/64x64.png $FLATPAK_DEST/share/icons/hicolor/64x64/apps/org.dupot.beatmatchtopass.png
      - install -Dm644 gameArchive/icons/512x512.png $FLATPAK_DEST/share/icons/hicolor/512x512/apps/org.dupot.beatmatchtopass.png
      - install -Dm644 gameArchive/${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 gameArchive/${FLATPAK_ID}.appdata.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml

    sources:
      - type: archive
        dest: gameArchive
        url: https://github.com/imikado/dupotBeatAndMatchToPass/releases/download/1.9.0/bundle.tar.gz
        sha256: a0779a4b5943f1c6e46bfca43fca4a4dbba335025ecc7b5d001481a342c8d25a

      - type: script
        dest-filename: beatmatchtopass.sh
        commands:
          - cd /app/bin/
          - /app/bin/godot-runner --main-pack /app/bin/beatmatchtopass.pck "$@"
